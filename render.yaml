services:
  - type: web
    name: sfx-networks
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: sfx-networks-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SFX_DATA_DIR
        value: /var/data
